services:
#Backend API
  api:
    build:
      context: .
    expose:
      - "1826"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/taskflow
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

#Nginx image
  nginx:
    image: nginx:stable-alpine
    ports:
      - "1826:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    
#mongoDB image
  mongo:
    image: mongo:8.0
    volumes:
      - taskflow-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  taskflow-mongo-data:
