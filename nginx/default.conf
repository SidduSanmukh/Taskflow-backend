#Nginx configuration

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://api:1826;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme;   
    }
}


# Let's understand the important directives.

# Directive	                    Purpose
# listen 80	                    Nginx listens on port 80 inside its container.
# server_name _	                Provides a catch-all server name for this simple configuration.
# location /	                    Handles requests whose path begins with /.
# proxy_pass http://api:5000	    Forwards requests to the Compose service named api, on port 5000.
# proxy_set_header Host $host	    Passes the original host information to Express.
# X-Real-IP	                    Passes the address of the immediate client connecting to Nginx.
# X-Forwarded-For	                Passes the forwarded client-address chain.
# X-Forwarded-Proto	            Indicates the original request scheme, such as HTTP.
# 
# The proxy_pass directive tells Nginx where to forward the request. Here, it preserves the original path, 
# so /health reaches Express as /health, and /api/tasks reaches Express as /api/tasks.